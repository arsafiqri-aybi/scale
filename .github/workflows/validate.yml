name: Validate Scale

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scale
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependency
        run: python -m pip install -r scale/requirements-dev.txt
      - name: Run static Skill audit
        run: python scale/scripts/audit_skill.py scale --portable
      - name: Validate example execution contract
        run: python scale/scripts/validate_contract.py scale/assets/execution-contract.json
      - name: Run auditor regression tests
        run: python scale/scripts/test_audit_skill.py
